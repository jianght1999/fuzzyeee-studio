<h1>【实验】简易扬声器</h1><div>材料：</div><div>一小块砂纸</div><div>几米长的绝缘铜线</div><div>两个鳄鱼夹</div><div>一个音频源（手机或者带有音频线的电脑）</div><div>几块足够强劲的永磁体</div><div>一个塑料容器（或者纸盘，纸板，或任何硬的东西）</div><div><br></div><div>操作步骤：</div><div>1.用砂纸打磨铜线两端，使之露出一点点内部的铜丝。</div><div>2.把铜丝卷成一个厚厚的线圈，两端露出一段长度，使之可以灵活运动。</div><div>3.铜线圈的两端各自夹上一个鳄鱼夹。</div><div>4.对于鳄鱼夹的另一端，其中一根夹在音频线的尖端，另一根夹在套管上。</div><div>5.接下来制作喇叭，把你的磁铁分成两份，一份放在容器里面的底部，一份放在外面，与之相吸。</div><div>6.最后将这个喇叭开口朝上放在线圈上，之后播放音乐。</div>
