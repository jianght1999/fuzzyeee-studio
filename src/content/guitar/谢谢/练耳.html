<h1>练耳</h1><h1><span style="font-weight: normal;"><font style="font-size: 14pt; text-indent: 21pt;">&nbsp; &nbsp; Barney Kessel</font><font style="font-size: 14pt; text-indent: 21pt;">说过，吉他手即兴的第一步是能够将脑海里的声音准确地弹出来，他建议了一种练习方式：先演奏一个和弦，不用管这个和弦有什么音，或者是什么和弦，我们需要闭上眼睛感受这个和弦的氛围，然后再哼唱或者吹一段适配的旋律，在各个把位把这个句子演奏出来。</font></span></h1>
